<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusicSync</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<script>
  // Apply the saved light/dark choice before the page draws, to avoid a flash.
  try { const t = localStorage.getItem("musicsync.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">

  <section class="bar" id="libraryBar" aria-label="Music folder">
    <label class="bar-label" for="libraryPath">Music folder</label>
    <input id="libraryPath" class="path" readonly placeholder="No folder chosen">
    <button id="browseLibrary">Browse…</button>
    <label class="check"><input type="checkbox" id="recursive" checked> Include subfolders</label>
    <button id="rescan">Rescan</button>
    <input id="filter" type="search" class="filter" placeholder="Filter by title, artist, album, genre" aria-label="Filter songs">
    <button id="themeBtn" class="icon" title="Switch to dark mode" aria-label="Switch to dark mode">
      <svg viewBox="0 0 24 24" id="themeIcon"></svg>
    </button>
  </section>

  <section class="bar" id="deviceBar" aria-label="Device">
    <label class="bar-label" for="driveSelect">Device</label>
    <select id="driveSelect"></select>
    <button id="refreshDevice" class="icon" title="Refresh drives and re-check the device" aria-label="Refresh drives">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="browseDevice" title="Pick any folder as the copy destination">Choose folder…</button>
    <span id="deviceInfo" class="device-info">No device chosen</span>
    <div class="device-actions">
      <span id="syncSummary" class="summary"></span>
      <button id="dupesBtn" disabled title="Find songs on the device with the same file name and artist">Detect duplicates</button>
      <button id="syncBtn" class="primary" disabled title="Copy checked songs to the device and delete unchecked ones from it">Sync to device</button>
    </div>
  </section>

  <main class="grid" id="grid" tabindex="0" aria-label="Songs">
    <div class="grid-head" id="gridHead"></div>
    <div class="grid-body" id="gridBody"></div>
    <div class="empty" id="empty">
      <p>Choose your music folder to see your songs.</p>
      <button class="primary" id="emptyBrowse">Choose music folder…</button>
    </div>
  </main>

  <section class="player" aria-label="Player">
    <div class="transport">
      <button class="icon" id="prevBtn" title="Previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="icon play" id="playBtn" title="Play / pause" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="icon" id="stopBtn" title="Stop" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button class="icon" id="nextBtn" title="Next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="now">
      <div class="now-title" id="nowTitle">Not playing</div>
      <div class="now-sub" id="nowSub">Double-click a song to play it</div>
    </div>
    <div class="modes" role="group" aria-label="Play mode">
      <button class="icon toggle" id="shuffleBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6C14.3 16 15.5 17 17.5 17H21M3 17h3.5c1.4 0 2.4-.5 3.3-1.4M14.2 8.4C15.1 7.5 16.1 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
      </button>
      <button class="icon toggle" id="repeatBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/></svg>
        <span class="badge" id="repeatBadge" hidden></span>
      </button>
      <button class="icon toggle" id="advanceBtn" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 6h12M4 11h8M4 16h8"/><path d="M15 11.5v7l6-3.5z" class="fill"/></svg>
      </button>
      <span class="mode-text" id="modeText"></span>
    </div>
    <div class="volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
    </div>
    <div class="seek">
      <span id="elapsed">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Position">
      <span id="total">0:00</span>
    </div>
  </section>

  <footer class="status">
    <span id="statusText">Starting…</span>
    <div class="busy" id="busy" hidden>
      <progress id="progress" max="1" value="0"></progress>
      <button id="cancelBtn">Cancel</button>
    </div>
  </footer>
</div>

<audio id="audio" preload="auto"></audio>

<div class="ctx" id="ctx" hidden role="menu">
  <button data-act="play" role="menuitem">Play</button>
  <hr>
  <button data-act="check" role="menuitem">Check for device <kbd>Space</kbd></button>
  <button data-act="uncheck" role="menuitem">Uncheck for device</button>
  <hr>
  <button data-act="reveal" role="menuitem">Show in folder</button>
</div>

<dialog id="picker">
  <form method="dialog" class="dlg">
    <h2 id="pickerTitle">Choose a folder</h2>
    <div class="picker-path">
      <button type="button" class="icon" id="pickerUp" title="Up one level" aria-label="Up one level">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input id="pickerPath" spellcheck="false" aria-label="Folder path">
      <button type="button" id="pickerGo">Go</button>
    </div>
    <ul id="pickerList" class="picker-list"></ul>
    <p class="hint" id="pickerHint"></p>
    <div class="dlg-actions">
      <button value="cancel">Cancel</button>
      <button value="ok" class="primary" id="pickerOk">Use this folder</button>
    </div>
  </form>
</dialog>

<dialog id="dupes" class="wide">
  <form method="dialog" class="dlg">
    <h2>Duplicates on the device</h2>
    <p id="dupesIntro" class="hint"></p>
    <ul id="dupesList" class="dupes-list"></ul>
    <div class="dlg-actions">
      <button value="cancel">Cancel</button>
      <button value="ok" class="primary" id="dupesOk">Remove from device</button>
    </div>
  </form>
</dialog>

<dialog id="msg">
  <form method="dialog" class="dlg">
    <h2 id="msgTitle"></h2>
    <div id="msgBody" class="msg-body"></div>
    <div class="dlg-actions">
      <button value="cancel" id="msgCancel">Cancel</button>
      <button value="ok" class="primary" id="msgOk">OK</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
